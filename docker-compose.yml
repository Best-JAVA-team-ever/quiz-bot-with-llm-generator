services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GIGACHAT_API_KEY=${GIGACHAT_API_KEY}
      - MONGODB_HOST=mongodb
      - MONGODB_DATABASE=${MONGODB_DATABASE:-quizbot}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - ADMIN_API_KEY=${JWT_SECRET:-secret-key}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
